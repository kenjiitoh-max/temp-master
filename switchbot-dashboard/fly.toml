app = "temp-master"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"
  ALLOWED_ORIGINS = "https://temp-master.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "temp_master_data"
  destination = "/data"
